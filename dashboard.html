<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 2rem;
            margin-top: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
        }

        .log-btn {
            padding: 12px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .log-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .log-btn:active {
            transform: translateY(0);
        }

        .dashboard-grid {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            padding: 0 2rem 2rem 2rem;
            box-sizing: border-box;
        }

        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid #2d2d2d;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-color: #3b82f6;
        }

        .card-title {
            font-size: 0.95rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .card-value {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1;
        }
        
        .card-value.primary {
            color: #3b82f6;
        }
        
        .card-value.success {
            color: #10b981;
        }
        
        .card-value.warning {
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard</h1>
        <button class="log-btn" onclick="window.location.href='log.html'">Log Today</button>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Current Streak</div>
            <div class="card-value warning" id="streak">0</div>
        </div>
        
        <div class="card">
            <div class="card-title">Total Days Tracked</div>
            <div class="card-value primary" id="totalDays">0</div>
        </div>
        
        <div class="card">
            <div class="card-title">Consistency</div>
            <div class="card-value success" id="consistency">0%</div>
        </div>
    </div>
    
    <div class="card premium-card" style="width: calc(100% - 4rem); max-width: 736px; margin-bottom: 2rem; align-items: flex-start; text-align: left;">
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 0.5rem;">
            <h2 style="font-size: 1.5rem; margin: 0; color: #ffffff;">Premium Insights</h2>
            <button id="premiumBtn" style="display: none; padding: 10px 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; border-radius: 8px; background-color: #f59e0b; color: white; transition: background-color 0.2s, transform 0.1s;" onmouseover="this.style.backgroundColor='#d97706'; this.style.transform='translateY(-2px)';" onmouseout="this.style.backgroundColor='#f59e0b'; this.style.transform='translateY(0)';" onmousedown="this.style.transform='translateY(0)';" onclick="localStorage.setItem('isPremium', 'true'); window.location.reload();">Upgrade to Premium (₹10)</button>
        </div>
        <div id="insights-content" style="color: #a0a0a0; font-size: 1.05rem; line-height: 1.5;">
            Loading...
        </div>
    </div>

    <script>
        function updateStats() {
            const logs = JSON.parse(localStorage.getItem('logs')) || [];
            
            const totalDays = logs.length;
            const studiedDays = logs.filter(log => log.studied).length;
            
            let consistency = 0;
            if (totalDays > 0) {
                consistency = Math.round((studiedDays / totalDays) * 100);
            }
            
            const sortedLogs = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let currentStreak = 0;
            for (let i = 0; i < sortedLogs.length; i++) {
                if (sortedLogs[i].studied) {
                    currentStreak++;
                } else {
                    break;
                }
            }
            
            document.getElementById('totalDays').innerText = totalDays;
            document.getElementById('consistency').innerText = consistency + '%';
            document.getElementById('streak').innerText = currentStreak + ' days';
        }
        
        function updatePremiumInsights() {
            const isPremium = localStorage.getItem('isPremium') === 'true';
            const insightsContainer = document.getElementById('insights-content');
            const premiumBtn = document.getElementById('premiumBtn');
            
            if (isPremium) {
                insightsContainer.innerHTML = 'You are most consistent on days 1–3 but tend to drop after that';
                insightsContainer.style.color = '#10b981';
                if (premiumBtn) premiumBtn.style.display = 'none';
            } else {
                insightsContainer.innerHTML = 'Unlock Premium for ₹10 to see your patterns and insights';
                insightsContainer.style.color = '#f59e0b';
                if (premiumBtn) premiumBtn.style.display = 'block';
            }
        }
        
        // Run on load
        updateStats();
        updatePremiumInsights();
    </script>
</body>
</html>
