<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 2rem;
            margin-top: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
        }

        .log-btn {
            padding: 12px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .log-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .log-btn:active {
            transform: translateY(0);
        }

        .dashboard-grid {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            padding: 0 2rem 2rem 2rem;
            box-sizing: border-box;
        }

        .card {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid #2d2d2d;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-color: #3b82f6;
        }

        .card-title {
            font-size: 0.95rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .card-value {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1;
        }
        
        .card-value.primary {
            color: #3b82f6;
        }
        
        .card-value.success {
            color: #10b981;
        }
        
        .card-value.warning {
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard</h1>
        <button class="log-btn" onclick="window.location.href='log.html'">Log Today</button>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-title">Current Streak</div>
            <div class="card-value warning">0</div>
        </div>
        
        <div class="card">
            <div class="card-title">Total Days Tracked</div>
            <div class="card-value primary">0</div>
        </div>
        
        <div class="card">
            <div class="card-title">Consistency</div>
            <div class="card-value success">0%</div>
        </div>
    </div>
</body>
</html>
