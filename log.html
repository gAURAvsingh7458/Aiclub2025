<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Today</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            background-color: #1e1e1e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 2rem;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .checkbox-group {
            flex-direction: row;
            align-items: center;
            background-color: #2d2d2d;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #3d3d3d;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s ease;
        }

        .checkbox-group:focus-within, .checkbox-group:hover {
            border-color: #3b82f6;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: #ffffff;
            font-weight: 500;
        }

        label {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #b3b3b3;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Log Today</h1>
        <form id="logForm">
            <div class="form-group checkbox-group">
                <input type="checkbox" id="studied" name="studied">
                <label for="studied">Did you study today?</label>
            </div>
            
            <div class="form-group">
                <label for="activity">What did you do?</label>
                <input type="text" id="activity" name="activity" placeholder="e.g. Practiced Array problems" required>
            </div>
            
            <div class="form-group">
                <label for="time">Time spent (hours)</label>
                <input type="number" id="time" name="time" min="0" step="0.5" placeholder="0" required>
            </div>
            
            <button type="submit">Save Log</button>
        </form>
    </div>
    <script>
        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const studied = document.getElementById('studied').checked;
            const activity = document.getElementById('activity').value;
            const time = parseFloat(document.getElementById('time').value);
            const date = new Date().toISOString().split('T')[0];
            
            const newLog = {
                date: date,
                studied: studied,
                task: activity,
                hours: time
            };
            
            let logs = JSON.parse(localStorage.getItem('logs')) || [];
            logs.push(newLog);
            localStorage.setItem('logs', JSON.stringify(logs));
            
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
