<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathPilot - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Abstract gradient background element -->
        <div class="auth-bg-blob"></div>
        <div class="auth-bg-blob2"></div>
        
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome to PathPilot</h2>
                <p>Your premium journey begins here.</p>
            </div>
            
            <div class="auth-tabs">
                <button id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Log In</button>
                <button id="tabSignup" class="auth-tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- Google Auth Integration -->
            <div class="google-auth-wrapper text-center">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="center"
                     style="display: flex; justify-content: center; margin-bottom: 24px;">
                </div>
            </div>

            <div class="auth-divider">
                <span>or continue with email</span>
            </div>

            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-glow w-100 mt-4 form-btn">Log In</button>
                <div id="loginFeedback" class="status-msg text-center"></div>
            </form>

            <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" required placeholder="Choose a unique username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required placeholder="Create a strong password">
                </div>
                <button type="submit" class="btn btn-glow w-100 mt-4 form-btn">Sign Up</button>
                <div id="signupFeedback" class="status-msg text-center"></div>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
