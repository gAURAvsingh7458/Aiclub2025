<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Habit Tracker - Neon Perspective</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0A0A0F;
        --card-bg: #111118;
        --primary: #00FFB2;
        --secondary: #7B61FF;
        --text-white: #FFFFFF;
        --text-dim: #E0E0E0;
        --text-gray: #666666;
        --border-dim: #1E1E2E;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Space Grotesk', sans-serif;
    }

    body {
        background-color: var(--bg);
        color: var(--text-white);
        line-height: 1.5;
        min-height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
    }

    /* Background Canvas */
    #bgCanvas {
        position: fixed;
        top: 0; 
        left: 0;
        width: 100%; 
        height: 100%;
        z-index: 0; 
        pointer-events: none;
    }

    /* Content Wrapper */
    .app-wrapper {
        position: relative;
        z-index: 1;
        max-width: 680px;
        margin: 0 auto;
        padding: 40px 20px 80px 20px;
    }

    /* Grid Layouts & Cards */
    .metric-row {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
    }

    .metric-card {
        flex: 1;
        background: var(--card-bg);
        border: 1px solid rgba(0, 255, 178, 0.3);
        border-radius: 12px;
        padding: 16px 20px;
        text-align: center;
        transition: all 0.3s ease;
    }
    .metric-card:hover {
        border-color: var(--primary);
        box-shadow: 0 0 15px rgba(0, 255, 178, 0.15);
    }
    .metric-num {
        font-size: 36px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1.1;
    }
    .metric-label {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--text-gray);
        margin-top: 6px;
        letter-spacing: 0.05em;
    }

    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }
    .date-text {
        color: var(--primary);
        font-family: monospace;
        font-size: 13px;
        margin-bottom: 4px;
    }
    .day-name {
        color: var(--text-white);
        font-size: 18px;
        font-weight: 600;
    }
    .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    hr.header-hr {
        border: none;
        border-bottom: 1px solid var(--border-dim);
        margin-bottom: 24px;
    }

    /* Buttons */
    .btn-load {
        background: transparent;
        border: 1px solid var(--primary);
        color: var(--primary);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-load:hover { background: rgba(0, 255, 178, 0.15); }

    .btn-reset {
        background: transparent;
        border: none;
        color: #444;
        padding: 8px 16px;
        font-size: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: color 0.2s;
    }
    .btn-reset:hover { color: #ff4d4d; }

    /* Progress Bar */
    .progress-wrap {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 24px;
        border: 1px solid var(--border-dim);
    }
    .progress-track {
        background: #1A1A2E;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
    }
    .progress-fill {
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        height: 100%;
        width: 0%;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 10px var(--primary), 0 0 20px rgba(0, 255, 178, 0.5);
    }
    .progress-pct {
        font-family: monospace;
        font-weight: 700;
        color: var(--primary);
        font-size: 14px;
    }

    /* Add Task Form */
    .add-task-form {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr auto;
        gap: 10px;
        margin-bottom: 32px;
    }
    @media(max-width: 550px){
        .add-task-form { grid-template-columns: 1fr; }
    }
    .add-task-form input, .add-task-form select {
        background: var(--card-bg);
        border: 1px solid var(--border-dim);
        border-radius: 8px;
        padding: 10px 14px;
        color: var(--text-white);
        font-family: inherit;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
    }
    .add-task-form input:focus, .add-task-form select:focus {
        border: 1px solid rgba(0, 255, 178, 0.6);
    }
    .add-task-form input::placeholder {
        color: #444;
    }
    .btn-add {
        background: var(--primary);
        color: var(--bg);
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 13px;
    }
    .btn-add:hover {
        box-shadow: 0 0 12px rgba(0, 255, 178, 0.5);
        transform: translateY(-1px);
    }

    /* Section Headers */
    .section-header-wrap { 
        display: flex; 
        align-items: center; 
        gap: 12px; 
        margin: 28px 0 12px 0; 
    }
    .section-title { 
        font-size: 10px; 
        text-transform: uppercase; 
        letter-spacing: 0.15em; 
        color: var(--secondary); 
        font-weight: 600; 
    }
    .section-line { 
        height: 1px; 
        flex: 1; 
        background: rgba(123, 97, 255, 0.2); 
    }

    /* Task Items */
    .tasks-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .task-item {
        background: var(--card-bg);
        border: 1px solid var(--border-dim);
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.2s;
        cursor: pointer;
        user-select: none;
    }
    .task-item:hover {
        border-color: rgba(0, 255, 178, 0.4);
        background: #13131F;
    }
    .task-item.completed {
        opacity: 0.4;
    }
    .task-item.completed .task-text {
        text-decoration: line-through;
        color: #444; 
    }
    .task-item.completed .task-time {
        text-decoration: line-through;
    }

    .circle-check {
        width: 22px; 
        height: 22px;
        border: 1.5px solid #333;
        border-radius: 50%;
        display: flex; 
        align-items: center; 
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
    }
    .task-item.completed .circle-check {
        background: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 0 8px var(--primary);
    }
    .circle-check svg {
        width: 12px; 
        height: 12px;
        fill: none; 
        stroke: white; 
        stroke-width: 3;
        opacity: 0;
        transition: all 0.2s;
    }
    .task-item.completed .circle-check svg {
        opacity: 1;
    }

    .task-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .task-text {
        font-size: 14px;
        color: var(--text-dim);
        transition: color 0.2s;
    }
    .task-time {
        font-size: 12px;
        color: #555;
        font-family: monospace;
        transition: color 0.2s;
    }

    .btn-delete {
        background: none;
        border: none;
        color: #444;
        cursor: pointer;
        padding: 4px;
        transition: color 0.2s;
    }
    .btn-delete:hover {
        color: #ff4d4d;
    }

    /* Weekly Chips */
    .weekly-wrap {
        margin-top: 48px;
        text-align: center;
    }
    .chips-container {
        display: flex; 
        gap: 8px; 
        justify-content: center;
    }
    .chip-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .streak-chip {
        width: 32px; 
        height: 32px;
        background: #1A1A2E;
        border: 1px solid #333;
        color: #555;
        border-radius: 6px;
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-size: 12px; 
        font-weight: 600;
        transition: all 0.3s;
    }
    .streak-chip.good {
        background: rgba(0, 255, 178, 0.15);
        border: 1px solid var(--primary);
        color: var(--primary);
        box-shadow: 0 0 8px rgba(0, 255, 178, 0.4);
    }
    .streak-chip.today {
        border: 1.5px solid var(--secondary);
        color: var(--secondary);
        background: rgba(123, 97, 255, 0.1);
    }
    .streak-chip.today.good {
        border-color: var(--primary);
        color: var(--primary);
    }

</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="app-wrapper">
    <!-- Header -->
    <div class="header">
        <div>
            <div class="date-text" id="dateText">0000-00-00</div>
            <div class="day-name" id="dayName">Day</div>
        </div>
        <div class="header-actions">
            <button class="btn-reset" onclick="resetDay()">Reset Day</button>
            <button class="btn-load" onclick="loadStudentPlan()">Load Student Plan</button>
        </div>
    </div>
    <hr class="header-hr">

    <!-- Metrics -->
    <div class="metric-row">
        <div class="metric-card">
            <div class="metric-num" id="statDone">0</div>
            <div class="metric-label">Done</div>
        </div>
        <div class="metric-card">
            <div class="metric-num" id="statLeft">0</div>
            <div class="metric-label">Left</div>
        </div>
        <div class="metric-card">
            <div class="metric-num" id="statStreak">0</div>
            <div class="metric-label">Streak</div>
        </div>
    </div>

    <!-- Daily Progress -->
    <div class="progress-wrap">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
            <div style="font-size: 11px; color:#666; text-transform:uppercase; font-weight: 600;">Daily Progress</div>
            <div class="progress-pct" id="progressPct">0%</div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Add Task Form -->
    <form class="add-task-form" id="addTaskForm">
        <input type="text" id="addText" placeholder="Task name..." required>
        <input type="time" id="addTime" required>
        <select id="addSection">
            <option value="Morning">Morning</option>
            <option value="College">College</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Study">Study</option>
            <option value="Evening">Evening</option>
        </select>
        <button type="submit" class="btn-add">Add Task</button>
    </form>

    <!-- Task List -->
    <div id="tasksContainer"></div>

    <!-- Weekly View -->
    <div class="weekly-wrap">
        <div style="font-size: 11px; text-transform:uppercase; color:#666; margin-bottom:12px; font-weight:600; letter-spacing:0.1em;">Last 7 Days</div>
        <div class="chips-container" id="chipsContainer"></div>
    </div>
</div>

<script>
    // --- Canvas Perspective Grid Animation ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let offset = 0;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        // Subtle horizon glow
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, canvas.width * 0.4);
        grad.addColorStop(0, 'rgba(0, 255, 178, 0.06)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 0.5;

        // Fanning vertical lines
        for(let i = 0; i < 14; i++) {
            const t = i / 13;
            // Spread widely at the bottom (-1 to 2 times width)
            const bottomX = cx - (canvas.width * 1.5) + (canvas.width * 3 * t);
            
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(bottomX, canvas.height);
            
            const lGrad = ctx.createLinearGradient(0, cy, 0, canvas.height);
            lGrad.addColorStop(0, 'rgba(0, 255, 178, 0.03)');
            lGrad.addColorStop(1, 'rgba(0, 255, 178, 0.18)');
            ctx.strokeStyle = lGrad;
            ctx.stroke();
        }

        // Looping horizontal lines fading in from the horizon
        offset += 0.004;
        offset = offset % 1;
        
        const h = canvas.height;
        for(let i = 0; i < 12; i++) {
            let t = (i + offset) / 12;
            let y = cy + (h - cy) * Math.pow(t, 2); // Quadratic perspective
            
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            
            const opacity = 0.03 + (0.15 * t);
            ctx.strokeStyle = `rgba(0, 255, 178, ${opacity})`;
            ctx.stroke();
        }
        
        requestAnimationFrame(drawGrid);
    }
    drawGrid();


    // --- Tracker Logic ---
    const presetPlan = [
        { id: 'm1', text: 'Wake up at 6 AM', time: '06:00', section: 'Morning' },
        { id: 'm2', text: 'Walk / stretching', time: '06:15', section: 'Morning' },
        { id: 'm3', text: 'DSA practice (C++ / Python)', time: '06:45', section: 'Morning' },
        { id: 'm4', text: 'Get ready + breakfast', time: '08:15', section: 'Morning' },
        { id: 'c1', text: 'Morning classes', time: '09:00', section: 'College' },
        { id: 'c2', text: 'Lunch + short rest', time: '12:00', section: 'College' },
        { id: 'c3', text: 'Afternoon classes', time: '13:00', section: 'College' },
        { id: 'a1', text: 'Recharge — nap or walk', time: '15:00', section: 'Afternoon' },
        { id: 's1', text: 'Python / Calculus problems', time: '16:30', section: 'Study' },
        { id: 's2', text: 'Project / coding practice', time: '17:30', section: 'Study' },
        { id: 'e1', text: 'Dinner', time: '19:00', section: 'Evening' },
        { id: 'e2', text: 'Gym session', time: '20:00', section: 'Evening' },
        { id: 'e3', text: 'Shower + cool down', time: '21:00', section: 'Evening' },
        { id: 'e4', text: 'Revision + plan tomorrow', time: '21:30', section: 'Evening' },
        { id: 'e5', text: 'Read, no screens', time: '22:00', section: 'Evening' },
        { id: 'e6', text: 'Sleep by 12 AM', time: '00:00', section: 'Evening' }
    ];

    const sectionOrder = ['Morning', 'College', 'Afternoon', 'Study', 'Evening'];
    const daysArr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    let tasks = [];
    const today = new Date();
    
    function getDateString(d) {
        return 'todo_' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    const todayKey = getDateString(today);

    function getCompleted(dateKey) {
        return JSON.parse(localStorage.getItem(dateKey) || '[]');
    }
    function setCompleted(dateKey, arr) {
        localStorage.setItem(dateKey, JSON.stringify(arr));
    }
    function saveTasks() {
        localStorage.setItem('todo_tasks_neon', JSON.stringify(tasks));
        render();
    }

    function init() {
        // Load independent task list
        const stored = localStorage.getItem('todo_tasks_neon');
        if(stored) tasks = JSON.parse(stored);
        
        // Setup Header Date
        document.getElementById('dateText').textContent = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        const dayNamesFull = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        document.getElementById('dayName').textContent = dayNamesFull[today.getDay()];
        
        render();
    }

    function formatTimeUI(timeStr) {
        if(!timeStr) return '';
        const [h, m] = timeStr.split(':');
        let hr = parseInt(h);
        const ampm = hr >= 12 ? 'PM' : 'AM';
        hr = hr % 12 || 12;
        return `${hr}:${m} ${ampm}`;
    }

    // Handlers
    document.getElementById('addTaskForm').addEventListener('submit', (e) => {
        e.preventDefault();
        tasks.push({
            id: 't_' + Date.now(),
            text: document.getElementById('addText').value,
            time: document.getElementById('addTime').value,
            section: document.getElementById('addSection').value
        });
        document.getElementById('addText').value = '';
        document.getElementById('addTime').value = '';
        saveTasks();
    });

    function toggleTask(e, id) {
        // Stop bubbling so clicking checkbox area doesn't fire container click randomly if layered
        e.stopPropagation();
        let comps = getCompleted(todayKey);
        if(comps.includes(id)) comps = comps.filter(x => x !== id);
        else comps.push(id);
        setCompleted(todayKey, comps);
        render();
    }

    function deleteTask(e, id) {
        e.stopPropagation();
        if(confirm('Delete task?')) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }
    }

    window.loadStudentPlan = function() {
        if(confirm('Replace all custom tasks with the preset Student Plan?')) {
            tasks = [...presetPlan];
            setCompleted(todayKey, []);
            saveTasks();
        }
    }

    window.resetDay = function() {
        if(confirm('Uncheck all tasks for today?')) {
            setCompleted(todayKey, []);
            render();
        }
    }

    function isGoodDay(dateKey) {
        if (tasks.length === 0) return false;
        // In a strictly perfect app, historical task lengths would be saved per day.
        // Assuming tasks array defines daily threshold for this exercise.
        const c = getCompleted(dateKey).length;
        return (c / tasks.length) >= 0.7;
    }

    function getStreak() {
        let streak = 0;
        let d = new Date(today);
        if(isGoodDay(getDateString(d))) streak++;
        
        for(let i=1; i<365; i++){
            d.setDate(d.getDate() - 1);
            if(isGoodDay(getDateString(d))) {
                streak++;
            } else {
                break; // Stop at first non-good day
            }
        }
        return streak;
    }

    function render() {
        const comps = getCompleted(todayKey);
        const total = tasks.length;
        const done = tasks.filter(t => comps.includes(t.id)).length;
        const left = total - done;
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);

        // Metrics update
        document.getElementById('statDone').textContent = done;
        document.getElementById('statLeft').textContent = left;
        document.getElementById('statStreak').textContent = getStreak();
        document.getElementById('progressPct').textContent = pct + '%';
        document.getElementById('progressFill').style.width = pct + '%';

        // Tasks container
        const tc = document.getElementById('tasksContainer');
        tc.innerHTML = '';

        if(total === 0) {
            tc.innerHTML = `<div style="text-align:center; color: var(--text-gray); font-size: 13px; padding: 40px 0;">No tasks scheduled. Add one below or load the Preset.</div>`;
        }

        sectionOrder.forEach(sect => {
            const sectTasks = tasks.filter(t => t.section === sect).sort((a,b) => a.time.localeCompare(b.time));
            if(sectTasks.length > 0) {
                // Header
                const hdr = document.createElement('div');
                hdr.className = 'section-header-wrap';
                hdr.innerHTML = `
                    <div class="section-title">${sect}</div>
                    <div class="section-line"></div>
                `;
                tc.appendChild(hdr);

                // List
                const list = document.createElement('div');
                list.className = 'tasks-list';
                
                sectTasks.forEach(t => {
                    const isDone = comps.includes(t.id);
                    const el = document.createElement('div');
                    el.className = 'task-item' + (isDone ? ' completed' : '');
                    el.onclick = (e) => {
                        if(e.target.tagName.toLowerCase() !== 'svg' && e.target.tagName.toLowerCase() !== 'path' && e.target.tagName.toLowerCase() !== 'button') {
                            toggleTask(e, t.id);
                        }
                    };
                    
                    el.innerHTML = `
                        <div class="circle-check">
                            <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                        </div>
                        <div class="task-info">
                            <span class="task-text">${t.text}</span>
                            <span class="task-time">${formatTimeUI(t.time)}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(event, '${t.id}')">
                            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;
                    list.appendChild(el);
                });
                tc.appendChild(list);
            }
        });

        // Weekly Chips
        const chipsCont = document.getElementById('chipsContainer');
        chipsCont.innerHTML = '';
        for(let i=6; i>=0; i--){
            let d = new Date(today);
            d.setDate(d.getDate() - i);
            const key = getDateString(d);
            const isToday = (i === 0);
            const good = isGoodDay(key);

            let classes = ['streak-chip'];
            if(good) classes.push('good');
            if(isToday) classes.push('today');

            const wrap = document.createElement('div');
            wrap.className = 'chip-wrapper';
            wrap.innerHTML = `
                <div class="${classes.join(' ')}">${daysArr[d.getDay()][0]}</div>
            `;
            chipsCont.appendChild(wrap);
        }
    }

    init();
</script>

</body>
</html>
