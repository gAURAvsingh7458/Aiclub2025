<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #1D9E75;
            --green-light: #e6f5f0;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .date-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .day-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            border: 1px solid var(--border);
            background: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            color: var(--text-main);
        }
        .btn:hover {
            background: #f3f4f6;
        }
        .btn-primary {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }
        .btn-primary:hover {
            background: #15805e;
            border-color: #15805e;
        }

        /* Progress Section */
        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        .progress-track {
            background: #f3f4f6;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .progress-fill {
            background: var(--green);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
        }
        .metric-item {
            border-right: 1px solid var(--border);
        }
        .metric-item:last-child {
            border-right: none;
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* Section Groups */
        .section-header {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            margin: 1.5rem 0 0.75rem 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Task Item */
        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s;
        }
        .task-card:hover { border-color: #d1d5db; }
        
        /* Circular Checkbox */
        .checkbox-container {
            position: relative;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .checkbox-input {
            opacity: 0;
            position: absolute;
            inset: 0;
            cursor: pointer;
            z-index: 2;
        }
        .checkbox-custom {
            position: absolute;
            inset: 0;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .checkbox-input:checked + .checkbox-custom {
            background: var(--green);
            border-color: var(--green);
        }
        .checkbox-custom svg {
            color: white;
            width: 14px;
            height: 14px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }
        .checkbox-input:checked + .checkbox-custom svg {
            opacity: 1;
            transform: scale(1);
        }

        .task-content {
            flex: 1;
        }
        .task-name {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s, text-decoration 0.2s;
        }
        .task-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }
        
        .checkbox-input:checked ~ .task-content .task-name {
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .checkbox-input:checked ~ .task-content .task-time {
            opacity: 0.7;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        /* Add Task Form */
        .add-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 0.5rem;
        }
        @media (max-width: 500px) {
            .add-form { grid-template-columns: 1fr; }
        }
        .input-field {
            border: 1px solid var(--border);
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
        }
        .input-field:focus { border-color: var(--green); }

        /* Weekly Streak */
        .streak-container {
            margin-top: 3rem;
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .streak-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .chips-container {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }
        .day-chip-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }
        .chip {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
        }
        .chip.done {
            background: var(--green);
            color: white;
            border: 1px solid var(--green);
        }
        .chip.missed {
            background: #e5e7eb;
            color: transparent; /* visually just gray block for older dates */
            border: 1px solid #e5e7eb;
        }
        .chip.today {
            background: transparent;
            border: 2px solid var(--green);
            color: var(--green);
        }
        .chip.today.done {
            background: var(--green);
            color: white;
        }
        .chip.future {
            background: transparent;
            border: 1px dashed var(--border);
            color: transparent;
        }
        
        .chip-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div>
            <div class="date-title" id="displayDate">Today</div>
            <div class="day-subtitle" id="displayDay">Loading...</div>
        </div>
        <div class="action-buttons">
            <button class="btn" onclick="resetDay()">Reset Day</button>
            <button class="btn btn-primary" onclick="loadStudentPlan()">Load Student Plan</button>
        </div>
    </div>

    <!-- Progress Card -->
    <div class="progress-card">
        <div class="progress-header">
            <span>Daily Progress</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-item">
                <div class="metric-value" id="statDone">0</div>
                <div class="metric-label">Done</div>
            </div>
            <div class="metric-item">
                <div class="metric-value" id="statLeft">0</div>
                <div class="metric-label">Left</div>
            </div>
            <div class="metric-item">
                <div class="metric-value" id="statStreak">0</div>
                <div class="metric-label">Streak (Days)</div>
            </div>
        </div>
    </div>

    <!-- Grouped Tasks -->
    <div id="tasksContainer"></div>

    <!-- Add Task Form -->
    <form class="add-form" id="addTaskForm">
        <input type="text" id="taskName" class="input-field" placeholder="Task name..." required>
        <input type="time" id="taskTime" class="input-field" required>
        <select id="taskSection" class="input-field">
            <option value="Morning">Morning</option>
            <option value="College">College</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Study">Study</option>
            <option value="Evening">Evening</option>
        </select>
        <button type="submit" class="btn btn-primary" style="height:100%">Add</button>
    </form>

    <!-- Weekly View -->
    <div class="streak-container">
        <div class="streak-title">Last 7 Days</div>
        <div class="chips-container" id="chipsContainer"></div>
    </div>
</div>

<script>
    // Constants & Preset
    const studentPlan = [
        { id: 'p1', text: 'Wake up at 6 AM', time: '06:00', section: 'Morning' },
        { id: 'p2', text: 'Walk / stretching', time: '06:15', section: 'Morning' },
        { id: 'p3', text: 'DSA practice (C++ / Python)', time: '06:45', section: 'Morning' },
        { id: 'p4', text: 'Get ready + breakfast', time: '08:15', section: 'Morning' },
        
        { id: 'p5', text: 'Morning classes', time: '09:00', section: 'College' },
        { id: 'p6', text: 'Lunch + short rest', time: '12:00', section: 'College' },
        { id: 'p7', text: 'Afternoon classes', time: '13:00', section: 'College' },
        
        { id: 'p8', text: 'Recharge — nap or walk', time: '15:00', section: 'Afternoon' },
        
        { id: 'p9', text: 'Python / Calculus problems', time: '16:30', section: 'Study' },
        { id: 'p10', text: 'Project / coding practice', time: '17:30', section: 'Study' },
        
        { id: 'p11', text: 'Dinner', time: '19:00', section: 'Evening' },
        { id: 'p12', text: 'Gym session', time: '20:00', section: 'Evening' },
        { id: 'p13', text: 'Shower + cool down', time: '21:00', section: 'Evening' },
        { id: 'p14', text: 'Revision + plan tomorrow', time: '21:30', section: 'Evening' },
        { id: 'p15', text: 'Read, no screens', time: '22:00', section: 'Evening' },
        { id: 'p16', text: 'Sleep by 12 AM', time: '00:00', section: 'Evening' }
    ];

    const sectionOrder = ['Morning', 'College', 'Afternoon', 'Study', 'Evening'];
    const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // State
    let tasks = [];
    
    // Tools
    const today = new Date();
    const todayKey = 'todo_' + today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

    // Get Daily Data (list of completed task IDs)
    function getCompletedForDate(dateStr) {
        return JSON.parse(localStorage.getItem(dateStr) || '[]');
    }

    // Save Daily Data
    function saveCompletedForDate(dateStr, arr) {
        localStorage.setItem(dateStr, JSON.stringify(arr));
    }

    // Load State
    function loadState() {
        const savedTasks = localStorage.getItem('todo_tasks');
        if (savedTasks) {
            tasks = JSON.parse(savedTasks);
        }
        renderApp();
    }

    // Save Tasks
    function saveTasks() {
        localStorage.setItem('todo_tasks', JSON.stringify(tasks));
        renderApp();
    }

    // Convert 24h to 12h for UI
    function formatTime(time24) {
        if (!time24) return '';
        const [h, m] = time24.split(':');
        let hours = parseInt(h);
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        return `${hours}:${m} ${ampm}`;
    }

    // Actions
    function toggleTask(taskId) {
        let completed = getCompletedForDate(todayKey);
        if (completed.includes(taskId)) {
            completed = completed.filter(id => id !== taskId);
        } else {
            completed.push(taskId);
        }
        saveCompletedForDate(todayKey, completed);
        renderApp();
    }

    function deleteTask(taskId) {
        tasks = tasks.filter(t => t.id !== taskId);
        saveTasks();
    }

    document.getElementById('addTaskForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const text = document.getElementById('taskName').value;
        const time = document.getElementById('taskTime').value;
        const section = document.getElementById('taskSection').value;
        
        const newTask = {
            id: 't_' + Date.now(),
            text,
            time,
            section
        };
        tasks.push(newTask);
        
        document.getElementById('taskName').value = '';
        document.getElementById('taskTime').value = '';
        saveTasks();
    });

    function loadStudentPlan() {
        if (confirm("This will replace your current tasks with the preset Student Plan. Continue?")) {
            tasks = [...studentPlan];
            // Clear today's completions
            saveCompletedForDate(todayKey, []);
            saveTasks();
        }
    }

    function resetDay() {
        if (confirm("Are you sure you want to uncheck all tasks for today?")) {
            saveCompletedForDate(todayKey, []);
            renderApp();
        }
    }

    // Compute Streak
    // A day is good if completion percentage >= 70%
    function isDayGood(dateStr) {
        // We evaluate against the current 'tasks' list size. 
        // For a perfectly stable app, we'd save the number of completed / total per day too.
        // But for this requirement, we dynamically calculate it against the current tasks,
        // or just count how many saved IDs there are relative to current tasks.
        if (tasks.length === 0) return false;
        const completedCount = getCompletedForDate(dateStr).length;
        const ratio = completedCount / tasks.length;
        return ratio >= 0.7;
    }

    function calculateStreak() {
        let streak = 0;
        let d = new Date(today);
        
        // Start checking from today
        const currKey = 'todo_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        
        if (isDayGood(currKey)) {
            streak++;
        }
        
        // Check backwards
        for (let i = 1; i < 365; i++) {
            let prevD = new Date(today);
            prevD.setDate(today.getDate() - i);
            let prevKey = 'todo_' + prevD.getFullYear() + '-' + String(prevD.getMonth()+1).padStart(2, '0') + '-' + String(prevD.getDate()).padStart(2, '0');
            
            if (isDayGood(prevKey)) {
                streak++;
            } else {
                // If checking today and it's not good, we can still have a streak from yesterday.
                if (i === 1 && streak === 0 && isDayGood(prevKey)) {
                    // special case: hadn't finished today yet, but yesterday was good, streak lives!
                    // Not strict adherence, so we just break.
                    break;
                } else if (i > 1 || streak > 0) {
                    break;
                }
            }
        }
        // Strict logic: count consecutive good days counting backward.
        // Let's implement robust streak:
        let robustStreak = 0;
        let pDate = new Date();
        const testTodayStr = 'todo_' + pDate.getFullYear() + '-' + String(pDate.getMonth()+1).padStart(2, '0') + '-' + String(pDate.getDate()).padStart(2, '0');
        
        let foundMiss = false;
        
        if (isDayGood(testTodayStr)) {
            robustStreak++;
        }
        
        for (let i = 1; i <= 365; i++) {
            pDate.setDate(pDate.getDate() - 1);
            let checkKey = 'todo_' + pDate.getFullYear() + '-' + String(pDate.getMonth()+1).padStart(2, '0') + '-' + String(pDate.getDate()).padStart(2, '0');
            if (isDayGood(checkKey)) {
                robustStreak++;
            } else {
                // if today is missed but yesterday was made, streak starts from yesterday?
                if (i === 1 && !isDayGood(testTodayStr)) {
                    // today not finished, but let's check yesterday
                    continue; 
                }
                break; // break on first miss past yesterday
            }
        }
        return robustStreak;
    }

    function renderWeeklyChips() {
        const chipsContainer = document.getElementById('chipsContainer');
        chipsContainer.innerHTML = '';
        
        // Get the Sunday of the current week (or just last 7 days ending today)
        // Prompt says "Show the last 7 days (Sun to Sat) as small day chips... defined by current week"
        // Let's just do Last 7 days culminating in Today.
        
        for (let i = 6; i >= 0; i--) {
            const dateObj = new Date();
            dateObj.setDate(today.getDate() - i);
            const dateKey = 'todo_' + dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
            
            const isToday = i === 0;
            const isGood = isDayGood(dateKey);
            
            // Check if this date has any completed items.
            // If it's a completely past day with 0 completed, it's gray.
            
            let classNames = ['chip'];
            if (isToday) {
                classNames.push('today');
                if (isGood) classNames.push('done');
            } else {
                if (isGood) classNames.push('done');
                else classNames.push('missed');
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'day-chip-wrapper';
            wrapper.innerHTML = `
                <div class="${classNames.join(' ')}">
                    ${isGood ? '✓' : ''}
                </div>
                <div class="chip-label">${daysOfWeek[dateObj.getDay()]}</div>
            `;
            chipsContainer.appendChild(wrapper);
        }
    }

    function renderApp() {
        // Format Date
        const options = { weekday: 'long', month: 'short', day: 'numeric' };
        document.getElementById('displayDate').textContent = 'Today, ' + today.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        document.getElementById('displayDay').textContent = daysOfWeek[today.getDay()] + 'day plan';

        // Get completions
        const completedIDs = getCompletedForDate(todayKey);
        
        // Progress Math
        const total = tasks.length;
        const done = tasks.filter(t => completedIDs.includes(t.id)).length;
        const left = total - done;
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);

        document.getElementById('progressText').textContent = pct + '%';
        document.getElementById('progressBar').style.width = pct + '%';
        
        document.getElementById('statDone').textContent = done;
        document.getElementById('statLeft').textContent = left;
        document.getElementById('statStreak').textContent = calculateStreak();

        // Render Tasks
        const container = document.getElementById('tasksContainer');
        container.innerHTML = '';

        if (tasks.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 2rem; color: #6b7280; font-size: 0.9rem;">No tasks created. Click "Load Student Plan" or add your own above!</div>';
        }

        // Grouping
        sectionOrder.forEach(sect => {
            const sectionTasks = tasks.filter(t => t.section === sect);
            
            // Sort by time
            sectionTasks.sort((a,b) => (a.time > b.time) ? 1 : -1);

            if (sectionTasks.length > 0) {
                const header = document.createElement('div');
                header.className = 'section-header';
                header.textContent = sect;
                container.appendChild(header);

                const list = document.createElement('div');
                list.className = 'task-list';

                sectionTasks.forEach(task => {
                    const isDone = completedIDs.includes(task.id);
                    const taskCard = document.createElement('label');
                    taskCard.className = 'task-card';
                    
                    taskCard.innerHTML = `
                        <div class="checkbox-container">
                            <input type="checkbox" class="checkbox-input" ${isDone ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                            <div class="checkbox-custom">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        </div>
                        <div class="task-content">
                            <div class="task-name">${task.text}</div>
                            <div class="task-time">${formatTime(task.time)}</div>
                        </div>
                        <button type="button" class="delete-btn" onclick="deleteTask('${task.id}')" title="Delete Task">
                            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;
                    list.appendChild(taskCard);
                });
                
                container.appendChild(list);
            }
        });

        renderWeeklyChips();
    }

    // Initialize
    loadState();
</script>

</body>
</html>
